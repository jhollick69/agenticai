<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GCSE Maths 3D Cram Lab</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #0b1020;
    --panel: #131a33;
    --panel2: #1b2347;
    --ink: #e8ecff;
    --muted: #8a93c2;
    --accent: #6ee7ff;
    --accent2: #ff7ae0;
    --good: #7dffb0;
    --warn: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 800px at 80% -10%, #1c2659 0%, var(--bg) 60%) fixed;
    color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    overflow: hidden;
  }
  #app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
  aside {
    background: var(--panel);
    border-right: 1px solid #222a55;
    padding: 14px;
    overflow-y: auto;
  }
  h1 {
    font-size: 16px;
    margin: 0 0 10px;
    letter-spacing: .3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tabs { display: grid; gap: 6px; margin-bottom: 14px; }
  .tab {
    background: var(--panel2);
    color: var(--ink);
    border: 1px solid #2a3470;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    font-size: 13px;
  }
  .tab:hover { border-color: var(--accent); }
  .tab.active {
    background: linear-gradient(90deg, rgba(110,231,255,.18), rgba(255,122,224,.18));
    border-color: var(--accent);
  }
  .group { margin-bottom: 14px; }
  .group h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin: 4px 0 6px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
  input[type=range] { width: 100%; }
  input[type=text], select {
    width: 100%;
    background: #0e1430;
    border: 1px solid #2a3470;
    color: var(--ink);
    padding: 6px 8px;
    border-radius: 6px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
  }
  .row { display: flex; gap: 6px; }
  .row > * { flex: 1; }
  button.act {
    background: var(--panel2);
    color: var(--ink);
    border: 1px solid #2a3470;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  button.act:hover { border-color: var(--accent); }
  button.act.primary {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #0b1020;
    border: none;
    font-weight: 600;
  }
  .pill {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 999px;
    background: #0e1430;
    border: 1px solid #2a3470;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 11px;
    color: var(--accent);
  }
  main { position: relative; }
  canvas { display: block; }
  #hud {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 340px;
    background: rgba(19, 26, 51, .9);
    backdrop-filter: blur(10px);
    border: 1px solid #2a3470;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 15px;
    line-height: 1.55;
  }
  #hud h3 {
    margin: 0 0 4px;
    font-size: 18px;
    color: var(--accent);
    letter-spacing: .5px;
  }
  #hud .tagline {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 10px;
  }
  #hud .formula {
    font-family: ui-monospace, Menlo, monospace;
    color: var(--ink);
    background: #0e1430;
    border: 1px solid #2a3470;
    padding: 8px 10px;
    border-radius: 8px;
    margin: 6px 0;
    white-space: pre-wrap;
    font-size: 13px;
  }
  #hud .big {
    font-size: 22px;
    font-weight: 700;
    color: var(--good);
    font-family: ui-monospace, Menlo, monospace;
  }
  #hud .v { color: var(--good); }
  #hud .w { color: var(--warn); }
  /* Top streak bar */
  #topbar {
    position: absolute;
    top: 14px;
    left: 14px;
    display: flex;
    gap: 8px;
    align-items: center;
    background: rgba(19, 26, 51, .85);
    backdrop-filter: blur(10px);
    border: 1px solid #2a3470;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
  }
  #topbar .stat { color: var(--ink); font-family: ui-monospace, Menlo, monospace; }
  #topbar .stat b { color: var(--accent); }
  #topbar .streak b { color: var(--warn); }
  /* Quiz overlay */
  #quiz {
    position: absolute;
    inset: 0;
    background: rgba(11, 16, 32, .75);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #quiz.show { display: flex; }
  #quiz .card {
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 16px;
    padding: 24px 28px;
    width: min(440px, 92vw);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  #quiz h2 {
    margin: 0 0 6px;
    font-size: 22px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #quiz .q {
    font-size: 16px;
    margin: 10px 0 14px;
    line-height: 1.5;
  }
  #quiz input[type=text] {
    font-size: 18px;
    padding: 10px 12px;
  }
  #quiz .feedback {
    min-height: 28px;
    margin-top: 10px;
    font-weight: 600;
  }
  #quiz .feedback.ok { color: var(--good); }
  #quiz .feedback.no { color: #ff7a7a; }
  /* Celebration */
  .burst {
    position: absolute;
    pointer-events: none;
    width: 8px; height: 8px;
    border-radius: 50%;
    z-index: 20;
    animation: burst 700ms ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  #hint {
    position: absolute;
    left: 14px;
    bottom: 14px;
    color: var(--muted);
    font-size: 11px;
    background: rgba(19, 26, 51, .75);
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid #2a3470;
  }
  details > summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .kv { display: flex; justify-content: space-between; gap: 8px; }
  .kv span:last-child { color: var(--good); font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>GCSE Maths · 3D Cram Lab</h1>
    <div class="tabs" id="tabs">
      <button class="tab active" data-mod="shapes">📦 Shapes — V & SA</button>
      <button class="tab" data-mod="pyth">📐 Pythagoras 3D & Trig</button>
      <button class="tab" data-mod="graph">📈 Graph Plotter</button>
      <button class="tab" data-mod="trans">🔄 Transformations</button>
    </div>
    <div id="controls"></div>
    <details>
      <summary>Tips</summary>
      <div style="color:var(--muted); font-size:12px; margin-top:6px">
        Drag to orbit · scroll to zoom · right-drag to pan. Switch topics with the buttons above.
      </div>
    </details>
  </aside>
  <main>
    <div id="topbar">
      <div class="stat">⭐ <b id="points">0</b></div>
      <div class="stat streak">🔥 <b id="streak">0</b></div>
      <div class="stat" style="color:var(--muted)">best <b id="best" style="color:var(--accent2)">0</b></div>
    </div>
    <div id="hud"></div>
    <div id="quiz"><div class="card">
      <h2 id="qTitle">Quick Challenge!</h2>
      <div class="q" id="qText"></div>
      <input type="text" id="qInput" placeholder="Type your answer…" autocomplete="off" />
      <div class="row" style="margin-top:10px; gap:8px; display:flex">
        <button class="act primary" id="qSubmit" style="flex:1">Submit ✓</button>
        <button class="act" id="qSkip">Skip</button>
        <button class="act" id="qClose">✕</button>
      </div>
      <div class="feedback" id="qFeedback"></div>
    </div></div>
    <div id="hint">Drag to rotate · scroll to zoom · right-click drag to pan</div>
  </main>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ───────────────────────── Scene plumbing ─────────────────────────
const main = document.querySelector('main');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
main.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 30, 80);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
camera.position.set(8, 7, 10);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(8, 12, 6);
scene.add(sun);
const rim = new THREE.DirectionalLight(0xff7ae0, 0.35);
rim.position.set(-6, 4, -8);
scene.add(rim);

// Grid + axes (always visible, cosmetic)
const grid = new THREE.GridHelper(20, 20, 0x2a3470, 0x1b2347);
scene.add(grid);
const axes = new THREE.AxesHelper(5);
scene.add(axes);

function resize() {
  const w = main.clientWidth, h = main.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// Group that each module fills with its own meshes
const stage = new THREE.Group();
scene.add(stage);
function clearStage() {
  while (stage.children.length) {
    const c = stage.children.pop();
    c.traverse?.(o => {
      o.geometry?.dispose?.();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
        else o.material.dispose();
      }
    });
  }
}

const hud = document.getElementById('hud');
const controlsEl = document.getElementById('controls');

// ───────────────────────── Score / streak / celebration ─────────────────────────
const Score = {
  points: +(localStorage.getItem('gcse_points') || 0),
  streak: 0,
  best: +(localStorage.getItem('gcse_best') || 0),
  refresh() {
    document.getElementById('points').textContent = this.points;
    document.getElementById('streak').textContent = this.streak;
    document.getElementById('best').textContent = this.best;
    localStorage.setItem('gcse_points', this.points);
    localStorage.setItem('gcse_best', this.best);
  },
  win(n = 1) {
    this.streak += 1;
    this.points += 10 * n + this.streak;  // streak bonus
    if (this.streak > this.best) this.best = this.streak;
    this.refresh();
    celebrate();
  },
  lose() {
    this.streak = 0;
    this.refresh();
  }
};
function celebrate() {
  const colors = ['#6ee7ff', '#ff7ae0', '#7dffb0', '#ffd166', '#ffffff'];
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  for (let i = 0; i < 28; i++) {
    const d = document.createElement('div');
    d.className = 'burst';
    d.style.left = cx + 'px';
    d.style.top = cy + 'px';
    d.style.background = colors[i % colors.length];
    const ang = (Math.PI * 2 * i) / 28 + Math.random() * 0.4;
    const r = 140 + Math.random() * 120;
    d.style.setProperty('--dx', Math.cos(ang) * r + 'px');
    d.style.setProperty('--dy', Math.sin(ang) * r + 'px');
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 750);
  }
}
Score.refresh();

// ───────────────────────── Quiz overlay ─────────────────────────
const Quiz = {
  current: null,
  open(spec) {
    this.current = spec;
    document.getElementById('qTitle').textContent = spec.title;
    document.getElementById('qText').innerHTML = spec.text;
    const inp = document.getElementById('qInput');
    inp.value = '';
    document.getElementById('qFeedback').textContent = '';
    document.getElementById('qFeedback').className = 'feedback';
    document.getElementById('quiz').classList.add('show');
    setTimeout(() => inp.focus(), 50);
  },
  close() {
    document.getElementById('quiz').classList.remove('show');
    this.current = null;
  },
  submit() {
    if (!this.current) return;
    const inp = document.getElementById('qInput');
    const fb = document.getElementById('qFeedback');
    const userVal = parseFloat(inp.value);
    if (!Number.isFinite(userVal)) {
      fb.textContent = 'Type a number!';
      fb.className = 'feedback no';
      return;
    }
    const tol = Math.max(0.05, Math.abs(this.current.answer) * 0.02);
    if (Math.abs(userVal - this.current.answer) <= tol) {
      Score.win();
      fb.textContent = `✅ Correct! +${10 + Score.streak} pts (streak ×${Score.streak})`;
      fb.className = 'feedback ok';
      setTimeout(() => {
        // re-roll same module's challenge
        const m = modules[active];
        if (m.challenge) Quiz.open(m.challenge());
      }, 1100);
    } else {
      Score.lose();
      fb.textContent = `❌ Answer was ${fmt(this.current.answer, 3)}. Streak reset.`;
      fb.className = 'feedback no';
    }
  }
};
document.getElementById('qSubmit').addEventListener('click', () => Quiz.submit());
document.getElementById('qSkip').addEventListener('click', () => {
  Score.lose();
  const m = modules[active];
  if (m.challenge) Quiz.open(m.challenge());
});
document.getElementById('qClose').addEventListener('click', () => Quiz.close());
document.getElementById('qInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') Quiz.submit();
  if (e.key === 'Escape') Quiz.close();
});
const rnd = (a, b, step = 1) => {
  const n = a + Math.floor(Math.random() * ((b - a) / step + 1)) * step;
  return Math.round(n / step) * step;
};
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// ───────────────────────── Helpers ─────────────────────────
const fmt = (n, d = 2) => Number.isFinite(n) ? (Math.abs(n) < 1e-9 ? 0 : Number(n.toFixed(d))) : '—';

function makeMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color, metalness: 0.1, roughness: 0.55, ...opts
  });
}
function makeEdges(geom, color = 0x6ee7ff) {
  const e = new THREE.EdgesGeometry(geom);
  return new THREE.LineSegments(e, new THREE.LineBasicMaterial({ color }));
}

function slider(label, min, max, step, val, onInput) {
  const wrap = document.createElement('div');
  wrap.className = 'group';
  const lab = document.createElement('label');
  const valSpan = document.createElement('span');
  valSpan.className = 'pill';
  valSpan.style.float = 'right';
  valSpan.textContent = val;
  lab.textContent = label;
  lab.appendChild(valSpan);
  const inp = document.createElement('input');
  inp.type = 'range';
  inp.min = min; inp.max = max; inp.step = step; inp.value = val;
  inp.addEventListener('input', () => {
    valSpan.textContent = inp.value;
    onInput(parseFloat(inp.value));
  });
  wrap.appendChild(lab);
  wrap.appendChild(inp);
  controlsEl.appendChild(wrap);
  return inp;
}

function selectBox(label, options, val, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'group';
  const lab = document.createElement('label');
  lab.textContent = label;
  const sel = document.createElement('select');
  for (const o of options) {
    const opt = document.createElement('option');
    opt.value = o.value; opt.textContent = o.label;
    if (o.value === val) opt.selected = true;
    sel.appendChild(opt);
  }
  sel.addEventListener('change', () => onChange(sel.value));
  wrap.appendChild(lab); wrap.appendChild(sel);
  controlsEl.appendChild(wrap);
  return sel;
}

function buttonRow(buttons) {
  const wrap = document.createElement('div');
  wrap.className = 'group row';
  for (const b of buttons) {
    const btn = document.createElement('button');
    btn.className = 'act' + (b.primary ? ' primary' : '');
    btn.textContent = b.label;
    btn.addEventListener('click', b.onClick);
    wrap.appendChild(btn);
  }
  controlsEl.appendChild(wrap);
}

function textInput(label, val, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'group';
  const lab = document.createElement('label');
  lab.textContent = label;
  const inp = document.createElement('input');
  inp.type = 'text'; inp.value = val;
  inp.addEventListener('change', () => onChange(inp.value));
  wrap.appendChild(lab); wrap.appendChild(inp);
  controlsEl.appendChild(wrap);
  return inp;
}

// ═════════════════════════ Module: Shapes ═════════════════════════
const Shapes = {
  state: { kind: 'cuboid', a: 3, b: 2, c: 4, r: 1.5, h: 3 },
  build() {
    controlsEl.innerHTML = '';
    selectBox('Shape', [
      { value: 'cube', label: 'Cube' },
      { value: 'cuboid', label: 'Cuboid' },
      { value: 'cylinder', label: 'Cylinder' },
      { value: 'cone', label: 'Cone' },
      { value: 'sphere', label: 'Sphere' },
      { value: 'sqpyr', label: 'Square-based pyramid' },
      { value: 'triprism', label: 'Triangular prism' },
    ], this.state.kind, v => { this.state.kind = v; this.rebuildControls(); this.draw(); });
    this.rebuildControlsBody();
  },
  rebuildControls() {
    // tear down everything below the shape selector
    const keep = controlsEl.firstChild;
    controlsEl.innerHTML = '';
    if (keep) controlsEl.appendChild(keep);
    this.rebuildControlsBody();
  },
  rebuildControlsBody() {
    const s = this.state, redraw = () => this.draw();
    const k = s.kind;
    if (k === 'cube') {
      slider('Side a', 0.5, 5, 0.1, s.a, v => { s.a = v; redraw(); });
    } else if (k === 'cuboid') {
      slider('Length a', 0.5, 6, 0.1, s.a, v => { s.a = v; redraw(); });
      slider('Width b',  0.5, 6, 0.1, s.b, v => { s.b = v; redraw(); });
      slider('Height c', 0.5, 6, 0.1, s.c, v => { s.c = v; redraw(); });
    } else if (k === 'cylinder' || k === 'cone') {
      slider('Radius r', 0.3, 3, 0.05, s.r, v => { s.r = v; redraw(); });
      slider('Height h', 0.5, 6, 0.1, s.h, v => { s.h = v; redraw(); });
    } else if (k === 'sphere') {
      slider('Radius r', 0.3, 3, 0.05, s.r, v => { s.r = v; redraw(); });
    } else if (k === 'sqpyr') {
      slider('Base a', 0.5, 5, 0.1, s.a, v => { s.a = v; redraw(); });
      slider('Height h', 0.5, 6, 0.1, s.h, v => { s.h = v; redraw(); });
    } else if (k === 'triprism') {
      slider('Tri base a', 0.5, 5, 0.1, s.a, v => { s.a = v; redraw(); });
      slider('Tri height b', 0.5, 5, 0.1, s.b, v => { s.b = v; redraw(); });
      slider('Length L', 0.5, 6, 0.1, s.c, v => { s.c = v; redraw(); });
    }
    buttonRow([
      { label: '🎲 Surprise me', onClick: () => this.randomize() },
      { label: '🎯 Challenge me', primary: true, onClick: () => Quiz.open(this.challenge()) },
    ]);
  },
  randomize() {
    const kinds = ['cube','cuboid','cylinder','cone','sphere','sqpyr','triprism'];
    this.state.kind = pick(kinds);
    this.state.a = rnd(1, 5, 0.5);
    this.state.b = rnd(1, 5, 0.5);
    this.state.c = rnd(1, 5, 0.5);
    this.state.r = rnd(1, 3, 0.5);
    this.state.h = rnd(1, 5, 0.5);
    this.build();
    this.draw();
  },
  challenge() {
    this.randomize();
    const s = this.state;
    let answer, prompt;
    const ask = pick(['volume', 'sa']);
    // recompute via draw — reuse logic via a switch
    let V = 0, SA = 0, label = '';
    const PI = Math.PI;
    if (s.kind === 'cube')      { V = s.a**3; SA = 6*s.a*s.a; label = `cube with side ${s.a}`; }
    else if (s.kind === 'cuboid'){ V = s.a*s.b*s.c; SA = 2*(s.a*s.b+s.b*s.c+s.a*s.c);
                                   label = `cuboid ${s.a}×${s.b}×${s.c}`; }
    else if (s.kind === 'cylinder'){ V = PI*s.r**2*s.h; SA = 2*PI*s.r*(s.r+s.h);
                                     label = `cylinder r=${s.r}, h=${s.h}`; }
    else if (s.kind === 'cone'){ const l = Math.hypot(s.r,s.h);
                                 V = (1/3)*PI*s.r**2*s.h; SA = PI*s.r*(s.r+l);
                                 label = `cone r=${s.r}, h=${s.h}`; }
    else if (s.kind === 'sphere'){ V = (4/3)*PI*s.r**3; SA = 4*PI*s.r**2;
                                   label = `sphere r=${s.r}`; }
    else if (s.kind === 'sqpyr'){ const l = Math.hypot(s.a/2,s.h);
                                  V = (1/3)*s.a*s.a*s.h; SA = s.a*s.a + 2*s.a*l;
                                  label = `square pyramid base=${s.a}, h=${s.h}`; }
    else if (s.kind === 'triprism'){ const tri = 0.5*s.a*s.b, hyp = Math.hypot(s.a,s.b);
                                     V = tri*s.c; SA = 2*tri + s.c*(s.a+s.b+hyp);
                                     label = `triangular prism (legs ${s.a},${s.b}, length ${s.c})`; }
    if (ask === 'volume') { answer = V; prompt = `<b>Volume</b> of ${label}?<br><span style="color:var(--muted); font-size:12px">(2 d.p., π = 3.14159)</span>`; }
    else                  { answer = SA; prompt = `<b>Surface area</b> of ${label}?<br><span style="color:var(--muted); font-size:12px">(2 d.p., π = 3.14159)</span>`; }
    return { title: '📦 Shape Challenge', text: prompt, answer };
  },
  draw() {
    clearStage();
    const s = this.state;
    let geom, V, SA, formulaV, formulaSA, lifted = 0;
    const PI = Math.PI;
    if (s.kind === 'cube') {
      geom = new THREE.BoxGeometry(s.a, s.a, s.a);
      V = s.a ** 3; SA = 6 * s.a * s.a; lifted = s.a / 2;
      formulaV = `V = a³ = ${s.a}³`;
      formulaSA = `SA = 6a² = 6 × ${s.a}²`;
    } else if (s.kind === 'cuboid') {
      geom = new THREE.BoxGeometry(s.a, s.c, s.b);
      V = s.a * s.b * s.c;
      SA = 2 * (s.a * s.b + s.b * s.c + s.a * s.c);
      lifted = s.c / 2;
      formulaV = `V = a × b × c = ${s.a} × ${s.b} × ${s.c}`;
      formulaSA = `SA = 2(ab + bc + ac)`;
    } else if (s.kind === 'cylinder') {
      geom = new THREE.CylinderGeometry(s.r, s.r, s.h, 48);
      V = PI * s.r ** 2 * s.h;
      SA = 2 * PI * s.r * (s.r + s.h);
      lifted = s.h / 2;
      formulaV = `V = πr²h = π × ${s.r}² × ${s.h}`;
      formulaSA = `SA = 2πr(r + h)`;
    } else if (s.kind === 'cone') {
      geom = new THREE.ConeGeometry(s.r, s.h, 48);
      const slant = Math.hypot(s.r, s.h);
      V = (1 / 3) * PI * s.r ** 2 * s.h;
      SA = PI * s.r * (s.r + slant);
      lifted = s.h / 2;
      formulaV = `V = ⅓πr²h`;
      formulaSA = `SA = πr(r + l),  l = √(r²+h²) = ${fmt(slant)}`;
    } else if (s.kind === 'sphere') {
      geom = new THREE.SphereGeometry(s.r, 48, 32);
      V = (4 / 3) * PI * s.r ** 3;
      SA = 4 * PI * s.r ** 2;
      lifted = s.r;
      formulaV = `V = ⁴⁄₃ πr³`;
      formulaSA = `SA = 4πr²`;
    } else if (s.kind === 'sqpyr') {
      // square pyramid: BufferGeometry from vertices
      const a = s.a, h = s.h;
      const half = a / 2;
      const verts = new Float32Array([
        -half, 0, -half,  half, 0, -half,  half, 0, half,
        -half, 0, -half,  half, 0,  half, -half, 0, half,
        -half, 0, -half,  half, 0, -half, 0, h, 0,
         half, 0, -half,  half, 0,  half, 0, h, 0,
         half, 0,  half, -half, 0,  half, 0, h, 0,
        -half, 0,  half, -half, 0, -half, 0, h, 0,
      ]);
      geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
      geom.computeVertexNormals();
      const slant = Math.hypot(half, h);
      V = (1 / 3) * a * a * h;
      SA = a * a + 2 * a * slant;
      lifted = 0;
      formulaV = `V = ⅓ × a² × h`;
      formulaSA = `SA = a² + 2a·l,  l = √((a/2)²+h²) = ${fmt(slant)}`;
    } else if (s.kind === 'triprism') {
      // right-angled triangular prism: triangle with legs a (base) and b (height), extruded length c
      const a = s.a, b = s.b, L = s.c;
      const shape = new THREE.Shape();
      shape.moveTo(-a / 2, 0);
      shape.lineTo(a / 2, 0);
      shape.lineTo(-a / 2, b);
      shape.lineTo(-a / 2, 0);
      geom = new THREE.ExtrudeGeometry(shape, { depth: L, bevelEnabled: false });
      geom.translate(0, 0, -L / 2);
      const tri = 0.5 * a * b;
      const hyp = Math.hypot(a, b);
      V = tri * L;
      SA = 2 * tri + L * (a + b + hyp);
      lifted = 0;
      formulaV = `V = ½·a·b · L`;
      formulaSA = `SA = 2·(½ab) + L·(a + b + √(a²+b²))`;
    }

    const mesh = new THREE.Mesh(geom, makeMat(0x6ee7ff, { transparent: true, opacity: 0.55 }));
    mesh.position.y = lifted;
    stage.add(mesh);
    const edges = makeEdges(geom, 0xff7ae0);
    edges.position.y = lifted;
    stage.add(edges);

    hud.innerHTML = `
      <h3>${s.kind.toUpperCase()}</h3>
      <div class="tagline">Drag sliders → watch V & SA change live.</div>
      <div class="kv"><span>Volume</span><span class="big">${fmt(V, 2)}</span></div>
      <div class="formula">${formulaV}</div>
      <div class="kv"><span>Surface area</span><span class="big">${fmt(SA, 2)}</span></div>
      <div class="formula">${formulaSA}</div>
    `;
  }
};

const Pyth = {
  state: { l: 4, w: 3, h: 2 },
  build() {
    controlsEl.innerHTML = '';
    const s = this.state, redraw = () => this.draw();
    slider('Length l', 0.5, 6, 0.1, s.l, v => { s.l = v; redraw(); });
    slider('Width  w', 0.5, 6, 0.1, s.w, v => { s.w = v; redraw(); });
    slider('Height h', 0.5, 6, 0.1, s.h, v => { s.h = v; redraw(); });
    buttonRow([
      { label: '🎲 Surprise me', onClick: () => this.randomize() },
      { label: '🎯 Challenge me', primary: true, onClick: () => Quiz.open(this.challenge()) },
    ]);
  },
  randomize() {
    this.state.l = rnd(2, 6, 0.5);
    this.state.w = rnd(2, 6, 0.5);
    this.state.h = rnd(2, 6, 0.5);
    this.draw();
  },
  challenge() {
    this.randomize();
    const { l, w, h } = this.state;
    const which = pick(['space', 'angle']);
    if (which === 'space') {
      const D = Math.sqrt(l*l + w*w + h*h);
      return {
        title: '📐 Pythagoras 3D',
        text: `Cuboid with sides <b>${l} × ${w} × ${h}</b>.<br>What is the <b>space diagonal</b>?<br><span style="color:var(--muted); font-size:12px">(2 d.p.)</span>`,
        answer: D
      };
    } else {
      const d = Math.sqrt(l*l + w*w);
      const ang = Math.atan2(h, d) * 180 / Math.PI;
      return {
        title: '📐 Trig in 3D',
        text: `Cuboid <b>${l} × ${w} × ${h}</b>.<br>Angle between space diagonal and base?<br><span style="color:var(--muted); font-size:12px">(degrees, 1 d.p.)</span>`,
        answer: ang
      };
    }
  },
  draw() {
    clearStage();
    const { l, w, h } = this.state;
    const box = new THREE.BoxGeometry(l, h, w);
    const mesh = new THREE.Mesh(box, makeMat(0x6ee7ff, { transparent: true, opacity: 0.18 }));
    mesh.position.set(0, h / 2, 0);
    stage.add(mesh);
    stage.add(makeEdges(box, 0x6ee7ff)).position.set(0, h / 2, 0);

    // Corners we care about
    const A = new THREE.Vector3(-l / 2, 0, -w / 2);  // base near corner
    const B = new THREE.Vector3( l / 2, 0,  w / 2);  // base far corner
    const C = new THREE.Vector3( l / 2, h,  w / 2);  // top far corner

    const baseDiag = A.distanceTo(B);
    const spaceDiag = A.distanceTo(C);
    const angleBase = Math.atan2(w, l) * 180 / Math.PI;        // angle in base
    const angleSpace = Math.atan2(h, baseDiag) * 180 / Math.PI; // diag with base

    const line = (p, q, color) => {
      const g = new THREE.BufferGeometry().setFromPoints([p, q]);
      return new THREE.Line(g, new THREE.LineBasicMaterial({ color, linewidth: 2 }));
    };
    stage.add(line(A, B, 0xffd166)); // base diagonal
    stage.add(line(A, C, 0xff7ae0)); // space diagonal
    stage.add(line(B, C, 0x7dffb0)); // vertical to top corner

    const dot = (p, color) => {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 12), makeMat(color));
      m.position.copy(p);
      return m;
    };
    stage.add(dot(A, 0xffffff));
    stage.add(dot(B, 0xffd166));
    stage.add(dot(C, 0xff7ae0));

    hud.innerHTML = `
      <h3>PYTHAGORAS 3D</h3>
      <div class="tagline">🟡 base diag · 🟣 space diag · 🟢 height</div>
      <div class="kv"><span>Space diag D</span><span class="big">${fmt(spaceDiag, 2)}</span></div>
      <div class="formula">D = √(l² + w² + h²) = √(${l}² + ${w}² + ${h}²)</div>
      <div class="kv"><span>Base diag d</span><span class="v">${fmt(baseDiag, 2)}</span></div>
      <div class="kv"><span>Angle to base</span><span class="w">${fmt(angleSpace, 1)}°</span></div>
      <div class="formula">θ = tan⁻¹(h ÷ d)</div>
    `;
  }
};

// ═════════════════════════ Module: Graph plotter ═════════════════════════
const Graph = {
  state: { mode: '2d', expr2d: 'x*x', expr3d: 'sin(x)*cos(y)' },
  build() {
    controlsEl.innerHTML = '';
    selectBox('Mode', [
      { value: '2d', label: '2D · y = f(x)' },
      { value: '3d', label: '3D · z = f(x, y)' },
    ], this.state.mode, v => { this.state.mode = v; this.rebuild(); });
    this.rebuildBody();
  },
  rebuild() {
    const keep = controlsEl.firstChild;
    controlsEl.innerHTML = '';
    if (keep) controlsEl.appendChild(keep);
    this.rebuildBody();
  },
  rebuildBody() {
    const s = this.state;
    if (s.mode === '2d') {
      const inp = textInput('y = ', s.expr2d, v => { s.expr2d = v; this.draw(); });
      buttonRow([
        { label: 'x²', onClick: () => { inp.value = 'x*x'; s.expr2d = inp.value; this.draw(); } },
        { label: 'x³', onClick: () => { inp.value = 'x*x*x'; s.expr2d = inp.value; this.draw(); } },
        { label: 'sin x', onClick: () => { inp.value = 'sin(x)'; s.expr2d = inp.value; this.draw(); } },
      ]);
      buttonRow([
        { label: '1/x', onClick: () => { inp.value = '1/x'; s.expr2d = inp.value; this.draw(); } },
        { label: '√x', onClick: () => { inp.value = 'sqrt(x)'; s.expr2d = inp.value; this.draw(); } },
        { label: '2x+3', onClick: () => { inp.value = '2*x + 3'; s.expr2d = inp.value; this.draw(); } },
      ]);
    } else {
      const inp = textInput('z = ', s.expr3d, v => { s.expr3d = v; this.draw(); });
      buttonRow([
        { label: 'x²+y²', onClick: () => { inp.value = 'x*x + y*y'; s.expr3d = inp.value; this.draw(); } },
        { label: 'x²−y² (saddle)', onClick: () => { inp.value = 'x*x - y*y'; s.expr3d = inp.value; this.draw(); } },
      ]);
      buttonRow([
        { label: 'sin x · cos y', onClick: () => { inp.value = 'sin(x)*cos(y)'; s.expr3d = inp.value; this.draw(); } },
        { label: 'sin(√(x²+y²))', onClick: () => { inp.value = 'sin(sqrt(x*x+y*y))'; s.expr3d = inp.value; this.draw(); } },
      ]);
    }
    buttonRow([
      { label: '🎯 Challenge me', primary: true, onClick: () => Quiz.open(this.challenge()) },
    ]);
  },
  challenge() {
    // Substitute a value into a randomly chosen expression
    const exprs2d = [
      { e: 'x*x', f: x => x*x, l: 'y = x²' },
      { e: '2*x + 3', f: x => 2*x+3, l: 'y = 2x + 3' },
      { e: 'x*x - 4*x + 3', f: x => x*x - 4*x + 3, l: 'y = x² − 4x + 3' },
      { e: 'x*x*x', f: x => x*x*x, l: 'y = x³' },
    ];
    const c = pick(exprs2d);
    const x = rnd(-3, 3);
    return {
      title: '📈 Substitute!',
      text: `For <b>${c.l}</b>, find <b>y when x = ${x}</b>.`,
      answer: c.f(x)
    };
  },
  compile(expr, vars) {
    try {
      const fn = new Function(...vars, `with(Math){return (${expr});}`);
      // smoke test
      fn(...vars.map(() => 1));
      return { fn, error: null };
    } catch (e) {
      return { fn: null, error: e.message };
    }
  },
  draw() {
    clearStage();
    const s = this.state;
    if (s.mode === '2d') {
      const { fn, error } = this.compile(s.expr2d, ['x']);
      if (error) { hud.innerHTML = `<h3>2D GRAPH</h3><div class="formula" style="color:#ff7a7a">Error: ${error}</div>`; return; }
      const N = 400, range = 6;
      const pts = [];
      let prevY = null;
      for (let i = 0; i <= N; i++) {
        const x = -range + (2 * range) * i / N;
        let y;
        try { y = fn(x); } catch { y = NaN; }
        if (Number.isFinite(y) && Math.abs(y) < 50) {
          pts.push(new THREE.Vector3(x, y, 0));
          prevY = y;
        } else if (pts.length) {
          // start new line segment
          const g = new THREE.BufferGeometry().setFromPoints(pts);
          stage.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0x6ee7ff })));
          pts.length = 0;
        }
      }
      if (pts.length) {
        const g = new THREE.BufferGeometry().setFromPoints(pts);
        stage.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0x6ee7ff })));
      }
      // axes
      const axisMat = new THREE.LineBasicMaterial({ color: 0x8a93c2 });
      stage.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
        [new THREE.Vector3(-range, 0, 0), new THREE.Vector3(range, 0, 0)]), axisMat));
      stage.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
        [new THREE.Vector3(0, -range, 0), new THREE.Vector3(0, range, 0)]), axisMat));

      hud.innerHTML = `
        <h3>2D · y = f(x)</h3>
        <div class="formula">y = ${s.expr2d}</div>
        <div class="kv"><span>f(0)</span><span>${fmt(safeCall(fn, 0))}</span></div>
        <div class="kv"><span>f(1)</span><span>${fmt(safeCall(fn, 1))}</span></div>
        <div class="kv"><span>f(2)</span><span>${fmt(safeCall(fn, 2))}</span></div>
        <div class="kv"><span>f(-1)</span><span>${fmt(safeCall(fn, -1))}</span></div>
        <div style="color:var(--muted); margin-top:8px; font-size:11px">
          Range x ∈ [−6, 6]. Try editing the expression — use sin, cos, sqrt, abs, exp.
        </div>
      `;
    } else {
      const { fn, error } = this.compile(s.expr3d, ['x', 'y']);
      if (error) { hud.innerHTML = `<h3>3D GRAPH</h3><div class="formula" style="color:#ff7a7a">Error: ${error}</div>`; return; }
      const seg = 60, range = 5;
      const geom = new THREE.PlaneGeometry(range * 2, range * 2, seg, seg);
      const pos = geom.attributes.position;
      let lo = Infinity, hi = -Infinity;
      const zs = new Float32Array(pos.count);
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i);
        let z;
        try { z = fn(x, y); } catch { z = 0; }
        if (!Number.isFinite(z)) z = 0;
        zs[i] = z;
        if (z < lo) lo = z;
        if (z > hi) hi = z;
      }
      const span = Math.max(1e-6, hi - lo);
      for (let i = 0; i < pos.count; i++) pos.setZ(i, zs[i]);
      pos.needsUpdate = true;
      geom.computeVertexNormals();

      // colour by height
      const colors = new Float32Array(pos.count * 3);
      const tmp = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        const t = (zs[i] - lo) / span;
        tmp.setHSL(0.62 - 0.55 * t, 0.85, 0.55);
        colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
      }
      geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true, side: THREE.DoubleSide,
        metalness: 0.05, roughness: 0.7, flatShading: false
      });
      const surface = new THREE.Mesh(geom, mat);
      surface.rotation.x = -Math.PI / 2;
      stage.add(surface);

      const wire = new THREE.LineSegments(
        new THREE.WireframeGeometry(geom),
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.08 })
      );
      wire.rotation.x = -Math.PI / 2;
      stage.add(wire);

      hud.innerHTML = `
        <h3>3D · z = f(x, y)</h3>
        <div class="formula">z = ${s.expr3d}</div>
        <div class="kv"><span>min z</span><span>${fmt(lo, 3)}</span></div>
        <div class="kv"><span>max z</span><span>${fmt(hi, 3)}</span></div>
        <div class="kv"><span>z(0,0)</span><span>${fmt(safeCall(fn, 0, 0))}</span></div>
        <div style="color:var(--muted); margin-top:8px; font-size:11px">
          Domain x,y ∈ [−5, 5]. Colour shows height.
        </div>
      `;
    }
  }
};
function safeCall(fn, ...args) { try { return fn(...args); } catch { return NaN; } }

// ═════════════════════════ Module: Transformations ═════════════════════════
const Trans = {
  state: { dx: 0, dy: 0, dz: 0, rx: 0, ry: 0, rz: 0, sx: 1, sy: 1, sz: 1, reflect: 'none' },
  build() {
    controlsEl.innerHTML = '';
    const s = this.state, redraw = () => this.draw();
    const heading = document.createElement('div');
    heading.className = 'group';
    heading.innerHTML = '<h2>Translation</h2>';
    controlsEl.appendChild(heading);
    slider('Δx', -5, 5, 0.1, s.dx, v => { s.dx = v; redraw(); });
    slider('Δy', -5, 5, 0.1, s.dy, v => { s.dy = v; redraw(); });
    slider('Δz', -5, 5, 0.1, s.dz, v => { s.dz = v; redraw(); });

    const h2 = document.createElement('div');
    h2.className = 'group';
    h2.innerHTML = '<h2>Rotation (degrees)</h2>';
    controlsEl.appendChild(h2);
    slider('about X', -180, 180, 1, s.rx, v => { s.rx = v; redraw(); });
    slider('about Y', -180, 180, 1, s.ry, v => { s.ry = v; redraw(); });
    slider('about Z', -180, 180, 1, s.rz, v => { s.rz = v; redraw(); });

    const h3 = document.createElement('div');
    h3.className = 'group';
    h3.innerHTML = '<h2>Enlargement</h2>';
    controlsEl.appendChild(h3);
    slider('Scale (uniform)', -2, 3, 0.1, s.sx, v => { s.sx = v; s.sy = v; s.sz = v; redraw(); });

    const h4 = document.createElement('div');
    h4.className = 'group';
    h4.innerHTML = '<h2>Reflection</h2>';
    controlsEl.appendChild(h4);
    selectBox('Reflect in plane', [
      { value: 'none', label: 'None' },
      { value: 'xy', label: 'xy-plane (flip z)' },
      { value: 'yz', label: 'yz-plane (flip x)' },
      { value: 'xz', label: 'xz-plane (flip y)' },
    ], s.reflect, v => { s.reflect = v; redraw(); });

    buttonRow([
      { label: 'Reset', onClick: () => {
        Object.assign(this.state, { dx:0, dy:0, dz:0, rx:0, ry:0, rz:0, sx:1, sy:1, sz:1, reflect:'none' });
        this.build(); this.draw();
      }},
      { label: '🎲 Surprise me', onClick: () => this.randomize() },
    ]);
    buttonRow([
      { label: '🎯 Challenge me', primary: true, onClick: () => Quiz.open(this.challenge()) },
    ]);
  },
  randomize() {
    Object.assign(this.state, {
      dx: rnd(-3, 3, 0.5), dy: rnd(-3, 3, 0.5), dz: rnd(-3, 3, 0.5),
      rx: rnd(-180, 180, 30), ry: rnd(-180, 180, 30), rz: rnd(-180, 180, 30),
      sx: pick([0.5, 1, 1.5, 2, -1]), sy: 1, sz: 1, reflect: pick(['none','xy','yz','xz']),
    });
    this.state.sy = this.state.sx; this.state.sz = this.state.sx;
    this.build(); this.draw();
  },
  challenge() {
    // Translate a point in 2D for simplicity (typical GCSE)
    const x = rnd(-4, 4), y = rnd(-4, 4);
    const dx = rnd(-5, 5), dy = rnd(-5, 5);
    const which = pick(['translate', 'reflect-x', 'reflect-y', 'rotate90']);
    if (which === 'translate') {
      return {
        title: '🔄 Translation',
        text: `Translate point (${x}, ${y}) by vector (${dx}, ${dy}).<br>What is the new <b>x</b>-coordinate?`,
        answer: x + dx
      };
    } else if (which === 'reflect-x') {
      return {
        title: '🔄 Reflection',
        text: `Reflect (${x}, ${y}) in the <b>x-axis</b>.<br>What is the new <b>y</b>-coordinate?`,
        answer: -y
      };
    } else if (which === 'reflect-y') {
      return {
        title: '🔄 Reflection',
        text: `Reflect (${x}, ${y}) in the <b>y-axis</b>.<br>What is the new <b>x</b>-coordinate?`,
        answer: -x
      };
    } else {
      // 90° clockwise about origin: (x,y) -> (y,-x)
      return {
        title: '🔄 Rotation 90° CW',
        text: `Rotate (${x}, ${y}) <b>90° clockwise</b> about origin.<br>What is the new <b>y</b>-coordinate?`,
        answer: -x
      };
    }
  },
  buildShape(color, opacity = 1) {
    // L-shaped solid built from two cuboids — chiral so reflections are visible
    const g = new THREE.Group();
    const mat = makeMat(color, { transparent: opacity < 1, opacity });
    const a = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 1), mat);
    a.position.set(0.5, 0.5, 0);
    const b = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
    b.position.set(-0.5, 1.5, 0);
    g.add(a); g.add(b);
    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(a.geometry),
      new THREE.LineBasicMaterial({ color: 0xffffff }))).position.copy(a.position);
    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(b.geometry),
      new THREE.LineBasicMaterial({ color: 0xffffff }))).position.copy(b.position);
    return g;
  },
  draw() {
    clearStage();
    const s = this.state;
    // Original (faded ghost)
    const ghost = this.buildShape(0x8a93c2, 0.18);
    stage.add(ghost);

    // Transformed copy
    const live = this.buildShape(0xff7ae0, 0.95);

    // Apply: scale → reflect → rotate → translate
    const m = new THREE.Matrix4();
    m.identity();
    const scaleM = new THREE.Matrix4().makeScale(s.sx, s.sy, s.sz);
    const refM = new THREE.Matrix4().identity();
    if (s.reflect === 'xy') refM.makeScale(1, 1, -1);
    if (s.reflect === 'yz') refM.makeScale(-1, 1, 1);
    if (s.reflect === 'xz') refM.makeScale(1, -1, 1);
    const eul = new THREE.Euler(
      s.rx * Math.PI / 180,
      s.ry * Math.PI / 180,
      s.rz * Math.PI / 180,
      'XYZ'
    );
    const rotM = new THREE.Matrix4().makeRotationFromEuler(eul);
    const transM = new THREE.Matrix4().makeTranslation(s.dx, s.dy, s.dz);
    m.multiply(transM).multiply(rotM).multiply(refM).multiply(scaleM);
    live.applyMatrix4(m);
    stage.add(live);

    // Origin marker
    const o = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 12), makeMat(0xffd166));
    stage.add(o);

    hud.innerHTML = `
      <h3>TRANSFORMATIONS</h3>
      <div class="formula">Translation: ( ${fmt(s.dx)}, ${fmt(s.dy)}, ${fmt(s.dz)} )</div>
      <div class="formula">Rotation: X ${fmt(s.rx, 0)}° · Y ${fmt(s.ry, 0)}° · Z ${fmt(s.rz, 0)}°</div>
      <div class="formula">Scale factor: ${fmt(s.sx, 2)}${s.sx < 0 ? '  (negative → through centre)' : ''}</div>
      <div class="formula">Reflection: ${s.reflect === 'none' ? 'none' : s.reflect + '-plane'}</div>
      <div style="color:var(--muted); margin-top:8px; font-size:11px">
        Grey = original · pink = image. Order applied: scale → reflect → rotate → translate.
      </div>
    `;
  }
};

// ───────────────────────── Tab routing ─────────────────────────
const modules = { shapes: Shapes, pyth: Pyth, graph: Graph, trans: Trans };
let active = 'shapes';
function activate(name) {
  active = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mod === name));
  modules[name].build();
  modules[name].draw();
}
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => activate(t.dataset.mod));
});
activate('shapes');

// ───────────────────────── Render loop ─────────────────────────
function tick() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
